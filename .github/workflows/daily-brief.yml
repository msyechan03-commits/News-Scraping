name: Rangkuman Berita Ekonomi Harian

on:
  # schedule dihapus — sekarang pakai cron-job.org (jam 7:00 WIB tepat) via workflow_dispatch
  # Untuk mengaktifkan kembali cron GitHub, uncomment 2 baris di bawah:
  # schedule:
  #   - cron: "0 18 * * *"
  workflow_dispatch: {}   # trigger dari cron-job.org & manual di tab "Actions"

permissions:
  contents: write   # perlu untuk commit+push PDF hasil generate ke repo

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (WeasyPrint butuh Pango/Cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate rangkuman & PDF (RSS + Koran OCR)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CNR_USERNAME: ${{ secrets.CNR_USERNAME }}
          CNR_PASSWORD: ${{ secrets.CNR_PASSWORD }}
        run: python pipeline.py generate

      - name: Commit & push PDF ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "output/"*.pdf
          git commit -m "chore: update rangkuman harian $(date -u +'%Y-%m-%d')" || echo "Tidak ada perubahan untuk di-commit"
          git pull --rebase || true
          git push

      - name: Kirim PDF ke WhatsApp via Business API
        env:
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_RECIPIENT: ${{ secrets.WA_RECIPIENT }}
        run: python pipeline.py send

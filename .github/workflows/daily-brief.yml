name: Rangkuman Berita Ekonomi Harian

on:
  # schedule dihapus — sekarang pakai cron-job.org (jam 7:00 WIB tepat) via workflow_dispatch
  # Untuk mengaktifkan kembali cron GitHub, uncomment 2 baris di bawah:
  # schedule:
  #   - cron: "0 18 * * *"
  workflow_dispatch: {}   # trigger dari cron-job.org & manual di tab "Actions"

permissions:
  contents: write   # perlu untuk commit+push PDF hasil generate ke repo

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (WeasyPrint butuh Pango/Cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate rangkuman & PDF (RSS + Koran OCR)
        env:
          # Migrasi: semua model (rangkuman + OCR koran) sekarang lewat OpenRouter,
          # model Gemini 2.5 Flash - satu API key utk semuanya.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CNR_USERNAME: ${{ secrets.CNR_USERNAME }}
          CNR_PASSWORD: ${{ secrets.CNR_PASSWORD }}
          # Supabase: audit DB (runs/articles/scores/ai_decisions/logs) + arsip Storage.
          # Kalau kedua secret ini kosong, tracker otomatis nonaktif & pipeline tetap jalan.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Second Brain (fitur opsional, narasi markdown terpisah) SENGAJA tidak
          # dimigrasi & ANTHROPIC_API_KEY sengaja tidak di-pass lagi ke sini - modul
          # second_brain.py otomatis no-op (lihat kode: return error "key tidak ada"
          # tanpa crash) kalau dipaksa aktifkan tanpa key ini.
          ENABLE_SECOND_BRAIN: ${{ secrets.ENABLE_SECOND_BRAIN }}
        run: python pipeline.py generate

      - name: Commit & push PDF ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "output/"*.pdf "output/captions/"*.txt
          git commit -m "chore: update rangkuman harian $(date -u +'%Y-%m-%d')" || echo "Tidak ada perubahan untuk di-commit"
          git pull --rebase || true
          git push

      - name: Kirim PDF ke WhatsApp via Business API
        env:
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_RECIPIENT: ${{ secrets.WA_RECIPIENT }}
        run: python pipeline.py send
